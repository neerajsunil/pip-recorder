[package]
name = "fastrecorder"
description = "A simple, native screen recorder for Windows with AV1, HEVC, H.264 and desktop/microphone audio"
repository = "https://github.com/neerajsunil/pip-recorder"
homepage = "https://github.com/neerajsunil/pip-recorder"
readme = "../../README.md"
keywords = ["screen-recorder", "windows", "av1", "slint", "rust"]
categories = ["multimedia::video", "gui"]
version.workspace = true
edition.workspace = true
license.workspace = true
build = "build.rs"

[features]
diagnostics = ["dep:image", "fastrecorder-platform/diagnostics"]

[dependencies]
fastrecorder-core.workspace = true
fastrecorder-platform.workspace = true
slint.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["png"], optional = true }

[target.'cfg(target_os = "windows")'.dependencies]
raw-window-handle = "0.6"
tray-icon = { version = "0.26", default-features = false }

[build-dependencies]
slint-build = "~1.18.1"
winresource = "0.1.31"

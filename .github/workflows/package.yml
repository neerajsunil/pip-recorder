name: Windows package
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Package version (for example 0.1.0-alpha.1)'
        required: true
        default: '0.1.0-alpha.1'
permissions:
  contents: read
jobs:
  windows-x64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: cargo build -p fastrecorder --release --locked
      - name: Package and checksums
        env:
          PACKAGE_VERSION: ${{ inputs.version }}
        run: ./scripts/package-windows.ps1 -Version $env:PACKAGE_VERSION
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: FastRecorder-windows-x64
          path: |
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error
